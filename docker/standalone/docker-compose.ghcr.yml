services:
  tdai-gateway:
    image: ghcr.io/${TDAI_GHCR_OWNER:-handsomexz}/tencentdb-agent-memory:${TDAI_GHCR_TAG:-latest}
    container_name: tdai-memory-gateway
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TDAI_GATEWAY_CONFIG: /config/tdai-gateway.standalone.yaml
      TDAI_DATA_DIR: /data/memory-tdai
      TDAI_GATEWAY_HOST: 0.0.0.0
      TDAI_GATEWAY_PORT: "8420"
      TDAI_DEPLOY_MODE: standalone
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - tdai_memory_data:/data/memory-tdai
      - ./tdai-gateway.standalone.yaml:/config/tdai-gateway.standalone.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  tdai-visualizer:
    image: ghcr.io/${TDAI_GHCR_OWNER:-handsomexz}/tencentdb-agent-memory-visualizer:${TDAI_GHCR_TAG:-latest}
    container_name: tdai-memory-visualizer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TDAI_VIS_HOST: 0.0.0.0
      TDAI_VIS_PORT: "8421"
      TDAI_VIS_DATA_DIR: /data/memory-tdai
      TDAI_VIS_OFFLOAD_ROOT: /data/memory-tdai/offload
    ports:
      - "127.0.0.1:8421:8421"
    volumes:
      - tdai_memory_data:/data/memory-tdai:ro
    depends_on:
      tdai-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8421/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  tdai_memory_data:
